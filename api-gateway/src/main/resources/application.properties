server.port=8080

spring.application.name=apigateway

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# =========================
# PRODUCT SERVICE
# =========================
spring.cloud.gateway.server.webflux.routes[0].id=productservice
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PRODUCTSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/products/**


# =========================
# VENDOR SERVICE
# =========================
spring.cloud.gateway.server.webflux.routes[1].id=vendorservice
spring.cloud.gateway.server.webflux.routes[1].uri=lb://VENDORSERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/vendors/**


# =========================
# ORDER SERVICE
# =========================
spring.cloud.gateway.server.webflux.routes[2].id=orderservice
spring.cloud.gateway.server.webflux.routes[2].uri=lb://ORDERSERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/orders/**